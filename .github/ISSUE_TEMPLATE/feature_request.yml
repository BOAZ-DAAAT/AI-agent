name: 기능 제안
description: 새로운 기능이나 기존 기능의 개선을 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        기능을 제안해 주셔서 감사합니다.
        제안의 배경과 기대 효과가 잘 드러나도록 아래 항목을 작성해 주세요.

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      description: 제안과 가장 관련된 영역을 선택해 주세요.
      options:
        - Agent orchestration
        - SQL agent
        - EDA agent
        - Analysis agent
        - Visualization agent
        - Report agent
        - Backend API
        - Database / Datasource
        - Test / CI
        - Documentation
        - 기타
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 제안 배경
      description: 어떤 문제를 해결하려 하나요?
      placeholder: 현재 어떤 문제가 있으며, 왜 개선이 필요한지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 기능
      description: 원하는 기능이나 개선 방향을 구체적으로 작성해 주세요.
    validations:
      required: true
