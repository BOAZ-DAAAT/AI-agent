# 서버에서 `docker compose up -d` 한 줄로 mysql + backend + frontend가 뜬다.
# 비밀값은 같은 폴더의 .env 에서 읽는다 (${...} 부분).

services:
  # ── 저장소 MySQL ──
  mysql:
    image: mysql:8.0
    command: ["--local-infile=1"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: analytics          # 미래 SQL 에이전트 마트용 스키마 미리 생성
    volumes:
      - mysql_data:/var/lib/mysql        # 재시작해도 데이터 유지 (영속의 핵심)
      - ./seed:/docker-entrypoint-initdb.d:ro 
    ports:
      - "127.0.0.1:3306:3306"            # 서버 내부 디버깅용, 외부 비공개
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── 경량 backend ──
  backend:
    build: .
    restart: unless-stopped
    environment:
      # 저장소 = 위 mysql 컨테이너. compose 안에서는 "서비스 이름 = 호스트명"
      STORAGE_MYSQL_HOST: mysql
      STORAGE_MYSQL_PORT: "3306"
      STORAGE_MYSQL_USER: root           # ingest가 DB DROP/CREATE를 하므로 root 필요
      STORAGE_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-43200}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
    ports:
      - "8000:8000"                      # 외부 공개 (프론트가 브라우저에서 직접 호출)
    depends_on:
      mysql:
        condition: service_healthy       # MySQL 준비된 뒤에 기동
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── 프론트: React 빌드 → nginx 서빙 ──
  frontend:
    build:
      context: ../Frontend               # 서버에 형제 폴더로 clone된 Frontend 레포
      args:
        # Vite는 "빌드 시점"에 API 주소가 결과물에 박힌다 → 빌드 인자로 주입
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "80:80"                          # http://<서버IP> 로 접속
    depends_on:
      - backend

volumes:
  mysql_data:
