name: 버그 리포트
description: 재현 가능한 오류나 예상과 다르게 동작하는 문제를 제보합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        버그를 제보해 주셔서 감사합니다.
        빠른 확인을 위해 아래 항목을 가능한 한 구체적으로 작성해 주세요.

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 명확하게 설명해 주세요.
      placeholder: 발생한 문제를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 다시 발생시킬 수 있도록 순서대로 작성해 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 결과
      description: 정상적으로 동작했다면 어떤 결과가 나와야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 실제로 발생한 결과를 작성해 주세요.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      description: 문제가 발생한 영역을 선택해 주세요.
      options:
        - Agent orchestration
        - SQL agent
        - EDA agent
        - Analysis agent
        - Visualization agent
        - Report agent
        - Backend API
        - Database / Datasource
        - Test / CI
        - Documentation
        - 기타
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 운영체제, Python 버전, 데이터베이스 등 문제와 관련된 환경을 작성해 주세요.
      placeholder: |
        - OS:
        - Python:
        - Database:
        - Branch / Commit:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 및 스크린샷
      description: 오류 로그나 스크린샷이 있다면 첨부해 주세요. 비밀번호, API 키, 토큰 등 민감정보는 반드시 제거해 주세요.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 문제 파악에 도움이 될 만한 다른 정보가 있다면 작성해 주세요.

  - type: checkboxes
    id: checklist
    attributes:
      label: 확인 사항
      options:
        - label: 동일하거나 유사한 Issue가 없는지 검색했습니다.
          required: true
        - label: 로그와 첨부 자료에서 민감정보를 제거했습니다.
          required: true
