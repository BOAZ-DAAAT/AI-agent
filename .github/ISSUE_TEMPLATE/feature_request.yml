name: 기능 제안
description: 새로운 기능이나 기존 기능의 개선을 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        기능을 제안해 주셔서 감사합니다.
        제안의 배경과 기대 효과가 잘 드러나도록 아래 항목을 작성해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 제안 배경
      description: 어떤 문제나 불편함을 해결하기 위한 제안인지 작성해 주세요.
      placeholder: 현재 어떤 문제가 있으며, 왜 개선이 필요한지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 기능
      description: 원하는 기능이나 개선 방향을 구체적으로 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: 기대 효과
      description: 이 기능이 사용자나 프로젝트에 어떤 가치를 제공하는지 작성해 주세요.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      description: 제안과 가장 관련된 영역을 선택해 주세요.
      options:
        - Agent orchestration
        - SQL agent
        - EDA agent
        - Analysis agent
        - Visualization agent
        - Report agent
        - Backend API
        - Database / Datasource
        - Test / CI
        - Documentation
        - 기타
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 구현 아이디어
      description: 생각해 둔 구현 방법이나 참고할 자료가 있다면 작성해 주세요.

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 어떤 상태가 되면 이 기능이 완료됐다고 판단할 수 있는지 작성해 주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 해결 방법을 검토했다면 함께 작성해 주세요.

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 참고 링크, 화면 예시 등 추가 자료가 있다면 첨부해 주세요.

  - type: checkboxes
    id: checklist
    attributes:
      label: 확인 사항
      options:
        - label: 동일하거나 유사한 Issue가 없는지 검색했습니다.
          required: true
        - label: 제안의 목적과 완료 조건을 구체적으로 작성했습니다.
          required: true
